syntax = "proto3";

package space;

option go_package = "space/proto;spacepb";

service SpaceService {
  rpc GetSpaceByID(GetSpaceByIDRequest) returns (GetSpaceByIDResponse);
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  rpc UpdateSpace(UpdateSpaceRequest) returns (UpdateSpaceResponse);
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
}

message Space {
  string space_id = 1;
  string name = 2;
  string location = 3;
  int32 capacity = 4;
  bool available = 5;
}

message GetSpaceByIDRequest {
  string space_id = 1;
}

message GetSpaceByIDResponse {
  string space_id = 1;
  string name = 2;
  string location = 3;
  int32 capacity = 4;
  bool available = 5;
}

message CreateSpaceRequest {
  string name = 1;
  string location = 2;
  int32 capacity = 3;
  bool available = 4;
}

message CreateSpaceResponse {
  string space_id = 1;
}

message UpdateSpaceRequest {
  string space_id = 1;
  string name = 2;
  string location = 3;
  int32 capacity = 4;
  bool available = 5;
}

message UpdateSpaceResponse {}

message DeleteSpaceRequest {
  string space_id = 1;
}

message DeleteSpaceResponse {}

message ListSpacesRequest {}

message ListSpacesResponse {
  repeated Space spaces = 1;
}
